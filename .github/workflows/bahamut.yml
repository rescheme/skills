name: Bahamut

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, review_requested, ready_for_review]

concurrency:
  group: bahamut-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  gate:
    name: Configure
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_BOT_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.MODEL_API_KEY != '' }}
        run: |
          if [ "${HAS_BOT_TOKEN}" = "true" ] && [ "${HAS_API_KEY}" = "true" ]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "Add secrets BOT_GITHUB_TOKEN and MODEL_API_KEY."
          fi

  review:
    name: Review
    needs: gate
    if: >
      needs.gate.outputs.ready == 'true' &&
      (github.event.pull_request.draft == false ||
      github.event.action == 'ready_for_review' ||
      github.event.action == 'review_requested')
    uses: rescheme/bahamut/.github/workflows/review.yml@v0.1.1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      event_name: ${{ github.event_name }}
      event_action: ${{ github.event.action }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      previous_head_sha: ${{ github.event.before }}
      image: ghcr.io/rescheme/bahamut-review:v0.1.1
    secrets:
      BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
